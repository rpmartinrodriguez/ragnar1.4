name: Ragnar — compilación de pruebas

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'test/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar web
        run: npm run build
